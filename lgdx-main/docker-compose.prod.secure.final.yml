# =============================================================================
# ОПТИМИЗАЦИЯ РЕСУРСОВ ДЛЯ 8 vCPU / 16 GB RAM
# =============================================================================
# 
# КОНЦЕПЦИЯ: Динамическое перераспределение ресурсов
# - api-sync-service работает интенсивно ~1 час в сутки (2:00-3:00)
# - Остальное время его ресурсы доступны другим сервисам
# - api-sync: резервация 1G/0.5 CPU, лимит 3G/2 CPU (по замерам пика)
#
# МОНИТОРИНГ (ОПТИМИЗИРОВАН):
# ✅ ELK Stack заменён на Loki + Promtail (экономия ~3.5GB памяти)
# ✅ Prometheus: оптимизирован до 384M/0.4 CPU (было 512M/0.5)
# ✅ Grafana: оптимизирован до 384M/0.4 CPU (было 512M/0.5)
# ✅ Loki: 512M/0.5 CPU (вместо Elasticsearch 2GB/1.0 CPU)
# ✅ Promtail: 128M/0.2 CPU (вместо Filebeat+Logstash+Kibana ~2.5GB)
#
# ИТОГОВОЕ РАСПРЕДЕЛЕНИЕ (ОБНОВЛЕНО):
#
# RESERVATIONS (гарантированные ресурсы):
# - CPU: ~7.35 vCPU (92% от 8 vCPU) ✅
# - Memory: ~7.3 GB (46% от 16 GB) ✅ (экономия 3.5GB от мониторинга)
#
# LIMITS (максимальные при пиках):
# - CPU: ~11.5 vCPU (overcommit 44%) ⚠️ Реально не используется одновременно
# - Memory: ~14.3 GB (89% от 16 GB) ✅ (экономия 3.5GB от мониторинга)
#
# КРИТИЧЕСКИЕ ИЗМЕНЕНИЯ:
# ✅ MongoDB: 1G→2G (критично для production с большим объемом данных)
# ✅ MongoDB CPU: 0.5→0.8 (больше для индексов и сложных запросов)
# ✅ Analytics Service: лимит 2G/2 CPU, резервация 1G/0.5 CPU (по замерам пика)
#
# РАСПИСАНИЕ СЕРВИСОВ (с координацией через Service Coordinator):
# - 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00: market-price-calculator (каждые 3 часа)
# - 01:30: ssl-renewal-service (понедельник, проверка SSL сертификатов)
# - 02:00: api-sync-service (пик нагрузки, синхронизация с внешними API)
# - 03:00: backup-service (после api-sync, ждет через ServiceCoordinator)
# - 03:45: analytics-service (после market-price-calculator, ждет через ServiceCoordinator)
#
# ПРЕИМУЩЕСТВА:
# ✅ api-sync: до 3GB+2CPU при пике sync; heap Node согласован с лимитом
# ✅ Остальные сервисы получили больше гарантированных ресурсов
# ✅ Общее использование железа более эффективное
# ✅ Безопасность: reservations гарантируют минимум для всех
# ✅ Мониторинг: экономия ~3.5GB памяти при сохранении функциональности
# ============================================================================= 