x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # MongoDB Production
  mongodb:
    image: mongo:6.0
    logging: *default-logging
    # ports removed to keep DB internal to overlay network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_password
      MONGO_INITDB_DATABASE: lgdx
    # Явно ограничиваем WiredTiger cache до 2GB (≈50% от лимита 4G).
    # По умолчанию Mongo берёт 50% (RAM-1GB) ОТ ВСЕЙ ХОСТ-RAM, что в Swarm
    # с лимитом контейнера приводит к OOM. Ставим вручную, в соответствии
    # с реально доступной памятью контейнера.
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "2"
      - --bind_ip_all
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lgdx-network
    healthcheck:
      test: ["CMD", "bash", "-c", "mongosh --username admin --password $$(cat /run/secrets/mongodb_password) --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 4G        # УВЕЛИЧЕНО (было 2G) - устраняет startup warning
                            # "Memory available less than total system memory"
                            # и снимает риск OOM под бета-нагрузкой.
          cpus: '1.5'
        reservations:
          memory: 2G        # УВЕЛИЧЕНО (было 1G) - гарантирует место под WiredTiger cache.
          cpus: '0.8'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    secrets:
      - mongodb_password

  # Redis Production
  redis:
    image: redis:7-alpine
    logging: *default-logging
    # ports removed to keep Redis internal to overlay network
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - redis_data:/data
    networks:
      - lgdx-network
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$(cat /run/secrets/redis_password) ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # RabbitMQ Production
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    logging: *default-logging
    hostname: rabbitmq
    # ports removed to keep RabbitMQ internal to overlay network
    environment:
      RABBITMQ_DEFAULT_USER: lgdx
    command: sh -c 'export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbitmq_password); rabbitmq-server'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - lgdx-network
      - monitoring-network
    secrets:
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "sh", "-c", "rabbitmq-diagnostics ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Main Server Production
  lgdx-server:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    # ports removed - WebSocket now works through Nginx proxy
    # No user: — entrypoint chowns bind-mounted uploads for UID 1001 then su-exec Node
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      ARE_MICROSERVICES_LIVE: "true"  # Microservices enabled - file-import-service handles all file uploads
      COOKIE_SECURE: "true"
      CSP_ENFORCE: "true"
      PUBLIC_UPLOADS_ENABLED: "false"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_SECRET_KEY_FILE: /run/secrets/admin_secret_key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      # Chat IDs from secrets
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # System Monitoring Bot
      SYSTEM_MONITORING_BOT_TOKEN_FILE: /run/secrets/system_monitoring_bot_token
      SYSTEM_MONITORING_CHAT_ID_FILE: /run/secrets/system_monitoring_chat_id
      CHAT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/chat_telegram_bot_token
      CHAT_TELEGRAM_CHAT_ID_FILE: /run/secrets/chat_telegram_chat_id
      # Registration Telegram Bot (username = bot @username without @, for "Link Telegram" link)
      REGISTRATION_TELEGRAM_BOT_USERNAME_FILE: /run/secrets/registration_telegram_bot_username
      REGISTRATION_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/registration_telegram_bot_token
      REGISTRATION_TELEGRAM_CHAT_ID_FILE: /run/secrets/registration_telegram_chat_id
      # Logist Telegram (notifications: ready for shipment, delivery confirmed)
      LOGIST_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/logist_telegram_bot_token
      LOGIST_TELEGRAM_CHAT_ID_FILE: /run/secrets/logist_telegram_chat_id
      # Twilio SMS Configuration
      TWILIO_ACCOUNT_SID_FILE: /run/secrets/twilio_account_sid
      TWILIO_AUTH_TOKEN_FILE: /run/secrets/twilio_auth_token
      TWILIO_VERIFY_SERVICE_SID_FILE: /run/secrets/twilio_verify_service_sid
      # From number for Twilio Programmable SMS (password reset link); required for real SMS (see sendPasswordResetSms)
      TWILIO_PHONE_NUMBER_FILE: /run/secrets/twilio_phone_number
      FRONTEND_BASE_URL: "https://lgdeal.com"
      OIL_PRICE_API_FILE: /run/secrets/oil_price_api
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # Support chat: OpenRouter only (skip Gemini first — avoids 429 on Gemini blocking the pipeline)
      SUPPORT_AI_PRIMARY: "openrouter"
      # google/gemini-2.0-flash-001 is currently rate-limited upstream at Google via OpenRouter shared pool.
      # Override to a model that is not gated. When new image with fallback chain is deployed, extras can be set via OPENROUTER_FALLBACK_MODELS.
      OPENROUTER_MODEL: "openai/gpt-4o-mini"
      OPENROUTER_FALLBACK_MODELS: "google/gemini-flash-1.5,meta-llama/llama-3.1-8b-instruct"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      MAX_FILE_SIZE: "50MB"
      UPLOAD_PATH: "./uploads"
      LOG_LEVEL: "info"
      INVITE_DENY_DOMAINS: "mailinator.com,tempmail.com"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "info@lgdeal.com"
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      SMTP_FROM: "info@lgdeal.com"
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_PUBLISHABLE_KEY_FILE: /run/secrets/stripe_publishable_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      # Performance optimizations
      NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
      UV_THREADPOOL_SIZE: "16"
      MONGODB_POOL_SIZE: "20"
      MONGODB_SOCKET_TIMEOUT: "30000"
      MONGODB_CONNECT_TIMEOUT: "10000"
      REDIS_CONNECTION_POOL_SIZE: "20"
      REDIS_COMMAND_TIMEOUT: "5000"
      RABBITMQ_CONNECTION_POOL_SIZE: "10"
      # Market price calculator (admin trigger "Run Market Calculation")
      MARKET_PRICE_CALCULATOR_URL: "http://market-price-calculator:9100"
      PROMETHEUS_URL: "http://prometheus:9090"
      # Legacy FTP (admin set-legacy): same key as legacy-ftp-poller for password encryption
      LEGACY_FTP_CRYPTO_KEY_FILE: /run/secrets/legacy_ftp_crypto_key
      LEGACY_POLLER_URL: "http://legacy-ftp-poller:3001"
      FTP_SERVICE_URL: "http://ftp-service:3000"
      # WhatsApp Cloud API (webhook)
      WHATSAPP_ENABLED: "true"
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      # Baileys (optional): enable admin outbound queue + status/QR for unofficial client worker
      WHATSAPP_BAILEYS_ENABLED: "true"
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lgdx-network
    secrets:
      - jwt_secret
      - admin_secret_key
      - telegram_bot_token
      - stock_telegram_bot_token
      - telegram_chat_id
      - stock_telegram_chat_id
      - registration_telegram_bot_username
      - registration_telegram_bot_token
      - registration_telegram_chat_id
      - logist_telegram_bot_token
      - logist_telegram_chat_id
      - twilio_account_sid
      - twilio_auth_token
      - twilio_verify_service_sid
      - twilio_phone_number
      - system_monitoring_bot_token
      - system_monitoring_chat_id
      - chat_telegram_bot_token
      - chat_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - oil_price_api
      - gemini_api_key
      - openrouter_api_key
      - smtp_pass
      - stripe_secret_key
      - stripe_publishable_key
      - stripe_webhook_secret
      - legacy_ftp_crypto_key
      - openai_api_key
      - whatsapp_verify_token
      - whatsapp_app_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G        # УВЕЛИЧЕНО (было 2G) - больше памяти для кэширования
          cpus: '3.0'       # УВЕЛИЧЕНО (было 2.0) - больше CPU для обработки
        reservations:
          memory: 2.5G      # УВЕЛИЧЕНО (было 1.5G) - больше гарантированной памяти
          cpus: '2.0'       # УВЕЛИЧЕНО (было 1.2) - больше гарантированного CPU
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # WhatsApp marketing LLM worker (docker secrets: whatsapp_*).
  whatsapp-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    user: "1001:1001"
    command: ["node", "dist/whatsapp/whatsappWorker.js"]
    depends_on:
      - rabbitmq
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      WHATSAPP_ENABLED: "true"
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      WHATSAPP_ACCESS_TOKEN_FILE: /run/secrets/whatsapp_access_token
      WHATSAPP_PHONE_NUMBER_ID_FILE: /run/secrets/whatsapp_phone_number_id
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_GRAPH_API_VERSION: "${WHATSAPP_GRAPH_API_VERSION:-v21.0}"
      OPENROUTER_MODEL_WHATSAPP: "${OPENROUTER_MODEL_WHATSAPP:-google/gemini-2.0-flash-001}"
      NODE_OPTIONS: "--max-old-space-size=768"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - rabbitmq_url
      - redis_url
      - mongodb_uri
      - openrouter_api_key
      - whatsapp_verify_token
      - whatsapp_access_token
      - whatsapp_phone_number_id
      - whatsapp_app_secret
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.15'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # WhatsApp Baileys (unofficial Web client) — one replica; persists session on volume.
  whatsapp-baileys-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    # Named volume is root-owned; entrypoint chowns WHATSAPP_BAILEYS_AUTH_DIR then su-exec → appuser
    # Use /bin/sh explicitly so CRLF in repo on Windows cannot break shebang inside the script
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint-baileys.sh"]
    command: ["node", "dist/whatsapp/whatsappBaileysWorker.js"]
    depends_on:
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      WHATSAPP_BAILEYS_ENABLED: "true"
      REDIS_URL_FILE: /run/secrets/redis_url
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts
      # crash the inbound pipeline and admin loses visibility into customer messages)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_MODEL_WHATSAPP_BAILEYS: "${OPENROUTER_MODEL_WHATSAPP_BAILEYS:-google/gemini-2.0-flash-001}"
      WHATSAPP_BAILEYS_AUTH_DIR: /data/auth_baileys
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - whatsapp_baileys_data:/data/auth_baileys
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    # Do not use cap_drop: ALL here: Docker Swarm/Desktop often still fails su-exec setgroups()
    # even with cap_add CHOWN/SETUID/SETGID. Node runs as appuser after entrypoint.
    networks:
      - lgdx-network
    secrets:
      - redis_url
      - mongodb_uri
      - openrouter_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.15'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Telegram user (GramJS / MTProto) — one replica; set TELEGRAM_API_ID + TELEGRAM_API_HASH (my.telegram.org).
  telegram-user-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    user: "1001:1001"
    command: ["node", "dist/telegramUser/telegramUserWorker.js"]
    depends_on:
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      TELEGRAM_USER_CLIENT_ENABLED: "${TELEGRAM_USER_CLIENT_ENABLED:-false}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_USER_AUTH_DIR: /data/telegram_user
      REDIS_URL_FILE: /run/secrets/redis_url
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_MODEL_TELEGRAM_USER: "${OPENROUTER_MODEL_TELEGRAM_USER:-google/gemini-2.0-flash-001}"
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - telegram_user_data:/data/telegram_user
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    networks:
      - lgdx-network
    secrets:
      - redis_url
      - mongodb_uri
      - openrouter_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.15'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # API Sync Service Production - оптимизирован для работы ~1 час в сутки
  api-sync-service:
    image: lgdx-api-sync-service:latest
    logging: *default-logging
    user: "1001:1001"
    stop_grace_period: 2500s
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      SERVICE_COORDINATOR_ENABLED: "true"
      NODE_OPTIONS: "--max-old-space-size=2048"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      API_SYNC_PREFETCH_COUNT: "2"
      API_SYNC_RETRY_DELAY: "10000"
      API_SYNC_MAX_RETRIES: "3"
      API_MAX_CONCURRENCY: "5"
      API_CB_FAILURES: "5"
      API_CB_COOLDOWN_MS: "60000"
      # Расписание синхронизации в часы минимальной нагрузки (автоматическая синхронизация через scheduler)
      SYNC_SCHEDULE: "0 2 * * *"
    volumes:
      - ./file-processing/reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - lgdx-network
    secrets:
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 3G        # Замеры пика ~1.5 GiB; запас под пики/GC
          cpus: '2.0'       # Пик ~1.5 vCPU
        reservations:
          memory: 1G
          cpus: '0.5'       # Ожидание между sync; пик получает до лимита
      restart_policy:
        condition: any
        delay: 5s

  # File Import Service Production
  file-import-service:
    image: lgdx-file-import-service:latest
    logging: *default-logging
    user: "1001:1001"
    stop_grace_period: 2500s
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=6144"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      FILE_IMPORT_PREFETCH_COUNT: "1"
      FILE_IMPORT_RETRY_DELAY: "15000"
      FILE_IMPORT_MAX_RETRIES: "3"
      MAX_FILE_SIZE: "150MB"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      UPLOAD_PATH: "./uploads"
      PROCESSED_PATH: "./processed"
      FAILED_PATH: "./failed"
      MAX_IMPORT_ROWS: "500000"  # Allow large supplier feeds (e.g. ~500k rows)
      MAX_IMPORT_BYTES: "125829120"  # 120 MiB (applied after optional supplier CSV preclean)
      # Mongo company ObjectIds (comma-separated): stream preclean (REHA-style) before import — see supplierCsvPreclean.ts
      FILE_IMPORT_SUPPLIER_CSV_PRECLEAN_COMPANY_IDS: "697d071957479e81df415385"
      # XLSX >= this size (MB) use streaming parser to avoid "Invalid string length" / zip errors (default 30)
      XLSX_STREAM_THRESHOLD_MB: "30"
      # Redis lock and RabbitMQ consumer timeout 40 min for large imports (e.g. ~450k rows)
      FILE_IMPORT_LOCK_TTL_SECONDS: "2400"
      FILE_IMPORT_CONSUMER_TIMEOUT_MS: "2400000"
      # Chunked processing for large XLSX (ExCut-style): split into temp CSVs, process one by one. 0 = off.
      FILE_IMPORT_CHUNK_ROW_THRESHOLD: "100000"
      FILE_IMPORT_CHUNK_SIZE: "50000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./file-processing/processed:/app/processed
      - ./file-processing/failed:/app/failed
      - ftp_data:/app/ftp-data
      - ./file-processing/reports:/app/reports
      - file_import_tmp:/tmp    # writable /tmp for ExcelJS streaming (tmp package) when read_only: true
    read_only: true
    networks:
      - lgdx-network
    secrets:
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 7G        # ВЫРОВНЕНО с api-product-sync-service для одинакового пика
          cpus: '2.0'
        reservations:
          memory: 1G        # Совпадает с api-product-sync-service (минимум в ожидании)
          cpus: '0.3'
      restart_policy:
        # Do not cap restarts: on stack deploy, RabbitMQ DNS can briefly be unavailable;
        # without retries the task exits and Swarm leaves the service at 0/1 (no FTP imports).
        condition: on-failure
        delay: 10s

  # Market Price Calculator Service Production
  market-price-calculator:
    image: lgdx-market-price-calculator:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OIL_PRICE_API_FILE: /run/secrets/oil_price_api
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # Economic coefficients optimized for Lab-Grown Diamonds (Phase 1)
      # See: info/27_Economic_Coefficients_Analysis.md
      COEFF_INR: "0.40"    # ↑ was 0.1 - Primary driver (80% costs in INR)
      COEFF_GOLD: "0.06"   # ↓ was 0.1 - Weak correlation
      COEFF_OIL: "0.07"    # ↓ was 0.1 - Logistics only
      LOG_LEVEL: "info"
      CALCULATION_INTERVAL: "0 */3 * * *"  # Каждые 3 часа в :00 UTC
      MAX_PROCESSING_TIME: "1800000"
      DB_CONNECTION_TIMEOUT: "60000"
      DB_SOCKET_TIMEOUT: "90000"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      MARKET_PRICE_CACHE_TTL_SECONDS: "86400"
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      # Service Coordinator - координация с Analytics Service
      SERVICE_COORDINATOR_ENABLED: "true"
    volumes:
      - ./market-price-calculator-service/logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - oil_price_api
      - redis_url
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1.2G      # УВЕЛИЧЕНО (было 1G) - больше гарантированной памяти
          cpus: '0.6'       # УВЕЛИЧЕНО (было 0.5) - больше гарантированного CPU
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  # Analytics Service Production (OPTIMIZED)
  analytics-service:
    image: lgdx-analytics-service:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      # Allow long analytics aggregations (3 minutes socket timeout)
      MONGODB_SOCKET_TIMEOUT_MS: "180000"
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      BACKEND_HOST: lgdx-server
      BACKEND_PORT: "5000"
      LOG_LEVEL: "info"
      ANALYTICS_SCHEDULE: "45 3 * * *"  # Каждый день в 3:45 UTC (избегаем конфликта с другими сервисами)
      NODE_OPTIONS: "--max-old-space-size=1536"  # Согласовано с лимитом контейнера 2G
      # Service Coordinator - ждет завершения Market Price Calculator перед запуском
      SERVICE_COORDINATOR_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - redis_url
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    depends_on:
      - mongodb
      - redis
      - lgdx-server
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9200/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s  # REDUCED from 60s
      timeout: 15s   # REDUCED from 30s
      retries: 3
      start_period: 60s  # REDUCED from 120s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G    # Замеры пика ~1.07 GiB; запас под агрегации
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  # Backup Service Production
  backup-service:
    image: lgdx-backup-service:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      SERVICE_COORDINATOR_ENABLED: "true"
      BACKUP_SCHEDULE: "0 3 * * *"  # 3:00 - теперь ждет завершения api-sync через ServiceCoordinator!
      RETENTION_COUNT: "7"
      BACKUP_PATH: "/app/backups"
      REPORTS_PATH: "/app/reports"
      # Hour-based retention takes precedence over REPORTS_RETENTION_DAYS (see backup-service config)
      REPORTS_RETENTION_HOURS: "24"
      REPORTS_CLEANUP_SCHEDULE: "0 */6 * * *"
      LOG_LEVEL: "info"
    volumes:
      - backup_data:/app/backups
      - ./file-processing/reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - redis_url
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
          cpus: '0.8'       # УМЕНЬШЕНО (было 1.0) - освобождаем CPU
        reservations:
          memory: 600M      # УВЕЛИЧЕНО (было 512M) - больше гарантированной памяти
          cpus: '0.4'       # УМЕНЬШЕНО (было 0.5) - но достаточно для backup раз в день
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # FTP Product Sync Service Production (Secure Final)
  ftp-service:
    image: lgdx-ftp-sync-service:latest
    logging: *default-logging
    # FTP порты открыты для внешних подключений поставщиков
    ports:
      - "21:21"           # FTP control port
      - "10000-10100:10000-10100"  # FTP passive data ports
    # Health check port остается внутренним (только для мониторинга)
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # Rate Limiting (защита от перегрузки)
      FTP_UPLOAD_DAILY_LIMIT: "1"  # Максимум 1 загрузка на компанию
      FTP_UPLOAD_RATE_LIMIT_WINDOW: "43200"  # Окно rate limit: 12 часов (секунды)
      # FTP specific settings (производственные значения)
      FTP_PORT: "21"
      FTP_HOST: "0.0.0.0"
      FTP_PASV_URL: "49.13.160.126"  # Прямой IP вместо домена для PASV
      FTP_PASV_PORT_MIN: "10000"
      FTP_PASV_PORT_MAX: "10100"
      FTP_DATA_PATH: "/app/ftp-data"  # ✅ Исправлено: путь должен совпадать с volume mapping
      FTP_MAX_FILE_SIZE_MB: "150"
      FTP_ALLOWED_FILE_TYPES: "xlsx,xls,csv"
      FTP_DEFAULT_QUOTA_MB: "1000"
      FTP_MAX_QUOTA_MB: "5000"
      FTP_MAX_CONNECTIONS: "50"
      FTP_CONNECTION_TIMEOUT: "300000"
      FTP_IDLE_TIMEOUT: "900000"
      FTP_MAX_LOGIN_ATTEMPTS: "3"
      FTP_LOGIN_WINDOW: "900000"
      # Принудительно включаем passive режим
      FTP_PASSIVE_MODE: "true"
      FTP_FORCE_PASSIVE: "true"
      # Безопасность: изоляция пользователей
      FTP_ROOT_ISOLATION: "true"
      FTP_CHROOT_TO_USER_HOME: "true"
      FTP_HIDE_SYSTEM_FILES: "true"
      LOG_LEVEL: "info"
      HEALTH_PORT: "3000"
    volumes:
      - ftp_data:/app/ftp-data  # ✅ Изменено: файлы теперь в /app/ftp-data для FileWatcher
      # Убираем системные папки из FTP доступа для безопасности
      # - ./server/uploads:/app/uploads
      # - ./reports:/app/reports
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 256M        # Снижено: чтобы задача могла разместиться при нехватке ресурсов
          cpus: '0.2'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Legacy FTP Poller — polls lgdeal.com FTP for companies not yet on new FTP
  legacy-ftp-poller:
    image: lgdx-legacy-ftp-poller:latest
    logging: *default-logging
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      LEGACY_FTP_CRYPTO_KEY_FILE: /run/secrets/legacy_ftp_crypto_key
      FTP_DATA_PATH: /app/ftp-data
      POLL_CRON_SCHEDULE: "0 */12 * * *"
      POLL_CONCURRENCY: "3"
      MAX_CONSECUTIVE_ERRORS: "5"
    volumes:
      - ftp_data:/app/ftp-data
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - legacy_ftp_crypto_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # React Client Production
  lgdx-client:
    image: lgdx-lgdx-client:latest
    logging: *default-logging
    environment:
      - REACT_APP_API_URL=https://lgdeal.com
      - REACT_APP_SENTRY_DSN_FILE=/run/secrets/sentry_dsn
      - REACT_APP_SENTRY_AUTH_TOKEN_FILE=/run/secrets/sentry_auth_token
      # REACT_APP_GA_MEASUREMENT_ID_FILE не нужен - entrypoint скрипт читает напрямую из secret
      - SENTRY_ORG=lgdeal-llc
      - SENTRY_PROJECT=lgdeal-net-client
      - NODE_ENV=production
    networks:
      - lgdx-network
    secrets:
      - sentry_dsn
      - sentry_auth_token
      - ga_measurement_id
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Nginx Reverse Proxy Production with SSL
  nginx:
    image: nginx:1.25-alpine
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.final.conf:/etc/nginx/nginx.conf:ro
      - acme_webroot:/var/www/certbot:ro
      # Primary (canonical) SSL lineage — serves https://lgdeal.com and https://www.lgdeal.com
      - /etc/letsencrypt/live/lgdeal.com/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/lgdeal.com/privkey.pem:/etc/ssl/private/privkey.pem:ro
      - /etc/letsencrypt/live/lgdeal.com/chain.pem:/etc/ssl/certs/chain.pem:ro
    networks:
      - lgdx-network
      - monitoring-network  # Добавлено для доступа к Grafana, Loki, Prometheus
    depends_on:
      - lgdx-server
      - lgdx-client
      - analytics-service
    command:
      - sh
      - -c
      - |
        for host in lgdx_lgdx-server lgdx_lgdx-client lgdx_analytics-service lgdx_market-price-calculator; do
          clean_host=`printf "%s" "$${host}" | tr -d "\015"`
          until getent hosts "$${clean_host}" >/dev/null 2>&1; do
            echo "waiting for $${clean_host}..."
            sleep 2
          done
        done
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Monitoring stack
  prometheus:
    image: prom/prometheus:v2.53.1
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - lgdx-network
      - monitoring-network
    depends_on:
      - alertmanager
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 192M
          cpus: '0.2'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    logging: *default-logging
    configs:
      # Имя источника намеренно версионируется (_v5) — Docker Swarm не умеет
      # менять existing config in-place, нужно создавать новый под новым именем
      # и обновлять ссылку. Если правишь monitoring/alertmanager.yml — бамп
      # суффикса (_v6, _v7…), иначе alertmanager не подхватит изменения.
      - source: alertmanager_config_v5
        target: /etc/alertmanager/alertmanager.yml
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        # chat_id читаем из docker-secret. tr [:space:] убирает любые
        # \r/\n/пробелы, иначе sed подставит мусор и YAML парсер упадёт
        # ("yaml: unmarshal errors: chat_id"), а Telegram API после такого
        # отвечал расплывчатым "message text is empty (400)".
        CHAT_ID=`cat /run/secrets/system_monitoring_chat_id | tr -d '[:space:]'`
        if [ -z "$${CHAT_ID}" ]; then
          echo "[alertmanager] FATAL: system_monitoring_chat_id is empty" >&2
          exit 1
        fi
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s/CHAT_ID_PLACEHOLDER/$${CHAT_ID}/g" /tmp/alertmanager.yml
        # Sanity-check: убеждаемся что плейсхолдер реально подставлен.
        if grep -q CHAT_ID_PLACEHOLDER /tmp/alertmanager.yml; then
          echo "[alertmanager] FATAL: CHAT_ID_PLACEHOLDER still present after sed" >&2
          exit 1
        fi
        echo "[alertmanager] config rendered with chat_id=$${CHAT_ID}"
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    secrets:
      - system_monitoring_bot_token
      - system_monitoring_chat_id
    networks:
      - monitoring-network
    deploy:
      # Убрали constraint - Alertmanager не критичен для размещения на manager
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'  # Уменьшено с 0.1 - Alertmanager не требует много CPU

  grafana:
    image: grafana/grafana:11.2.0
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_DATABASE_TYPE=sqlite3
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SERVER_ROOT_URL=https://lgdeal.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-network
    secrets:
      - source: grafana_admin_user
        target: grafana_admin_user
        uid: "472"
        gid: "0"
        mode: 0400
      - source: grafana_admin_password
        target: grafana_admin_password
        uid: "472"
        gid: "0"
        mode: 0400
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 192M
          cpus: '0.2'

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    logging: *default-logging
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    networks:
      - monitoring-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    logging: *default-logging
    volumes:
      - /:/rootfs:ro
      # Docker Engine socket (for image/container metadata in prod)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # Docker Desktop may not have /dev/disk; keep mounts minimal for portability
    command:
      - "--housekeeping_interval=30s"
      - "--docker=unix:///var/run/docker.sock"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory"
    networks:
      - monitoring-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    pid: host

  loki:
    image: grafana/loki:2.9.3
    logging: *default-logging
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    tmpfs:
      - /tmp
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /loki/rules
        exec /usr/bin/loki -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  promtail:
    image: grafana/promtail:2.9.3
    logging: *default-logging
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-network
    depends_on:
      - loki
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # SSL Certificate Auto-Renewal Service (must run on manager to run docker service scale/update)
  ssl-renewal-service:
    image: lgdx-ssl-renewal-service:latest
    logging: *default-logging
    user: "root"
    environment:
      NODE_ENV: production
      DOMAIN: "lgdeal.com"
      CERT_NAME: "lgdeal.com"
      # One SAN cert for both canonical (.com) and legacy (.net) to allow HTTPS redirect from .net
      CERTBOT_DOMAINS: "lgdeal.com,www.lgdeal.com,lgdeal.net,www.lgdeal.net"
      STACK_NAME: "lgdx"
      NGINX_SERVICE_NAME: "lgdx_nginx"
      CERT_PATH: "/etc/letsencrypt/live/lgdeal.com"
      ACME_WEBROOT: "/var/www/certbot"
      BACKUP_DIR: "/app/ssl-backups"
      LOG_FILE: "/app/logs/ssl-renewal.log"
      RENEWAL_SCHEDULE: "30 1 * * 1"  # Monday 01:30 UTC (избегаем конфликта с другими задачами в 02:00-04:00)
      COMPOSE_FILE: "/opt/lgdx/docker-compose.prod.secure.final.yml"
      LOG_LEVEL: "info"
      HEALTH_PORT: "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /etc/letsencrypt:/etc/letsencrypt:rw
      - acme_webroot:/var/www/certbot:rw
      - /opt/lgdx:/opt/lgdx:ro
      - ssl_backups:/app/ssl-backups
      - ssl_logs:/app/logs
    networks:
      - lgdx-network
    secrets:
      - system_monitoring_bot_token
      - system_monitoring_chat_id
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 32M
