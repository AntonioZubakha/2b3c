## LGDX RabbitMQ configuration
##
## We run long-running consumers (api-sync / file-import) that may legitimately
## take >30 minutes before acknowledging a message (heavy external API fetch +
## bulk DB writes). RabbitMQ defaults can close the channel with:
## PRECONDITION_FAILED - delivery acknowledgement ... timed out (1800000 ms).
##
## Set the consumer acknowledgement timeout to a safer value.
## Value is in milliseconds.
consumer_timeout = 14400000

