server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # File-based docker logs scraping (stable labels, no Loki 400 due to empty labelsets).
    # promtail container already mounts:
    # - /var/lib/docker/containers:/var/lib/docker/containers:ro
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'docker'
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - docker: {}
      - regex:
          source: filename
          expression: '.*/(?P<container_id>[0-9a-f]{64})/.*'
      - labels:
          container_id:

