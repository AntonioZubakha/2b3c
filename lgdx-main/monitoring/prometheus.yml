global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'lgdx-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_lgdx-server:5000']

  - job_name: 'lgdx-api-sync-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_api-sync-service:9100']

  - job_name: 'lgdx-file-import-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_file-import-service:9101']

  - job_name: 'lgdx-market-price-calculator'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_market-price-calculator:9100']

  - job_name: 'lgdx-analytics-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_analytics-service:9200']

  - job_name: 'lgdx-backup-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_backup-service:3000']

  - job_name: 'lgdx-ftp-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_ftp-service:3000']

  # SSL expiry / renewal status (replaces blackbox probe_ssl_* which was never scraped)
  - job_name: 'lgdx-ssl-renewal-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_ssl-renewal-service:3000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['tasks.node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['tasks.cadvisor:8080']

  - job_name: 'lgdx-rabbitmq'
    metrics_path: /metrics
    static_configs:
      - targets: ['tasks.lgdx_rabbitmq:15692']