global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram-default'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'telegram-warning'
      repeat_interval: 2h

# ВАЖНО: chat_id подставляется entrypoint-скриптом в docker-compose
# из docker-secret system_monitoring_chat_id (placeholder ниже).
# Не использовать chat_id_file: эта опция появилась только в Alertmanager v0.31,
# у нас закреплён v0.27.0.
#
# ВАЖНО про шаблоны:
# - Не используем `since` — этой функции нет в text/template Alertmanager (она
#   доступна только в Prometheus). Использование приводит к рендеру пустой
#   строки и к Telegram-ошибке "Bad Request: message text is empty (400)".
# - Каждый шаблон содержит статичный текст-заголовок, чтобы итоговое сообщение
#   гарантированно не было пустым даже при отсутствии лейблов/аннотаций.
receivers:
  - name: 'telegram-default'
    telegram_configs:
      - bot_token_file: /run/secrets/system_monitoring_bot_token
        chat_id: CHAT_ID_PLACEHOLDER
        parse_mode: 'HTML'
        message: |
          🚨 <b>LGDX Alert</b>

          <b>Alert:</b> {{ .GroupLabels.alertname | default "unknown" }}
          <b>Status:</b> {{ .Status | default "firing" }}
          <b>Severity:</b> {{ .CommonLabels.severity | default "info" }}

          <b>Summary:</b> {{ .CommonAnnotations.summary | default "(no summary)" }}
          <b>Description:</b> {{ .CommonAnnotations.description | default "(no description)" }}

          <b>Instances:</b>
          {{ range .Alerts }}
          • {{ .Labels.instance | default "n/a" }} (job: {{ .Labels.job | default "n/a" }})
          {{ else }}
          • (no instances)
          {{ end }}

          <b>Started:</b> {{ (index .Alerts 0).StartsAt.Format "2006-01-02 15:04:05 UTC" }}

  - name: 'telegram-critical'
    telegram_configs:
      - bot_token_file: /run/secrets/system_monitoring_bot_token
        chat_id: CHAT_ID_PLACEHOLDER
        parse_mode: 'HTML'
        message: |
          🔴 <b>CRITICAL ALERT - LGDX</b>

          <b>Alert:</b> {{ .GroupLabels.alertname | default "unknown" }}
          <b>Status:</b> {{ .Status | default "firing" }}
          <b>Severity:</b> {{ .CommonLabels.severity | default "critical" }}

          <b>Summary:</b> {{ .CommonAnnotations.summary | default "(no summary)" }}
          <b>Description:</b> {{ .CommonAnnotations.description | default "(no description)" }}

          <b>Instances:</b>
          {{ range .Alerts }}
          • {{ .Labels.instance | default "n/a" }} (job: {{ .Labels.job | default "n/a" }})
          {{ else }}
          • (no instances)
          {{ end }}

          <b>Started:</b> {{ (index .Alerts 0).StartsAt.Format "2006-01-02 15:04:05 UTC" }}

          ⚠️ <b>IMMEDIATE ACTION REQUIRED</b>

  - name: 'telegram-warning'
    telegram_configs:
      - bot_token_file: /run/secrets/system_monitoring_bot_token
        chat_id: CHAT_ID_PLACEHOLDER
        parse_mode: 'HTML'
        message: |
          ⚠️ <b>Warning - LGDX</b>

          <b>Alert:</b> {{ .GroupLabels.alertname | default "unknown" }}
          <b>Status:</b> {{ .Status | default "firing" }}
          <b>Severity:</b> {{ .CommonLabels.severity | default "warning" }}

          <b>Summary:</b> {{ .CommonAnnotations.summary | default "(no summary)" }}
          <b>Description:</b> {{ .CommonAnnotations.description | default "(no description)" }}

          <b>Instances:</b>
          {{ range .Alerts }}
          • {{ .Labels.instance | default "n/a" }} (job: {{ .Labels.job | default "n/a" }})
          {{ else }}
          • (no instances)
          {{ end }}

          <b>Started:</b> {{ (index .Alerts 0).StartsAt.Format "2006-01-02 15:04:05 UTC" }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
