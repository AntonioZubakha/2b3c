services:
  # MongoDB for Development
  mongodb-dev:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: lgdx_dev
    volumes:
      - mongodb_dev_data:/data/db
      - ./scripts/mongo-init-dev.js/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lgdx-dev-network

  # Redis for Development
  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_dev_data:/data
    networks:
      - lgdx-dev-network

  # RabbitMQ for Development
  rabbitmq-dev:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - lgdx-dev-network

  # LGDX Server (Development)
  lgdx-server-dev:
    build: 
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb-dev:27017/lgdx_dev?authSource=admin
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq-dev:5672
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-dev:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STOCK_TELEGRAM_BOT_TOKEN=${STOCK_TELEGRAM_BOT_TOKEN}
      - STOCK_TELEGRAM_CHAT_ID=${STOCK_TELEGRAM_CHAT_ID}
      - REGISTRATION_TELEGRAM_BOT_TOKEN=${REGISTRATION_TELEGRAM_BOT_TOKEN}
      - REGISTRATION_TELEGRAM_CHAT_ID=${REGISTRATION_TELEGRAM_CHAT_ID}
      - SYSTEM_MONITORING_BOT_TOKEN=${SYSTEM_MONITORING_BOT_TOKEN}
      - SYSTEM_MONITORING_CHAT_ID=${SYSTEM_MONITORING_CHAT_ID}
      - CHAT_TELEGRAM_BOT_TOKEN=${CHAT_TELEGRAM_BOT_TOKEN}
      - CHAT_TELEGRAM_CHAT_ID=${CHAT_TELEGRAM_CHAT_ID}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
      - OIL_PRICE_API=${OIL_PRICE_API}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_FROM=${SMTP_FROM}
      - INVITE_DENY_DOMAINS=mailinator.com,tempmail.com
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_PATH=${UPLOAD_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - API_SYNC_PREFETCH_COUNT=${API_SYNC_PREFETCH_COUNT}
      - API_SYNC_RETRY_DELAY=${API_SYNC_RETRY_DELAY}
      - API_SYNC_MAX_RETRIES=${API_SYNC_MAX_RETRIES}
      - FILE_IMPORT_PREFETCH_COUNT=${FILE_IMPORT_PREFETCH_COUNT}
      - FILE_IMPORT_RETRY_DELAY=${FILE_IMPORT_RETRY_DELAY}
      - FILE_IMPORT_MAX_RETRIES=${FILE_IMPORT_MAX_RETRIES}
      - ARE_MICROSERVICES_LIVE=true
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - rabbitmq-dev
      - mongodb-dev
      - redis-dev
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lgdx-dev-network

  # API Sync / FTP / Backup / Legacy FTP — отключены в dev для лёгкого стека (включить при необходимости)

  # File Import Service (Development)
  file-import-service-dev:
    build: 
      context: ./file-product-import-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb-dev:27017/lgdx_dev?authSource=admin
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq-dev:5672
      - REDIS_URL=redis://redis-dev:6379
      - SKIP_MARKET_PRICE_CACHE_INIT=true
      - DISABLE_MARKET_PRICE_CACHE=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STOCK_TELEGRAM_BOT_TOKEN=${STOCK_TELEGRAM_BOT_TOKEN}
      - STOCK_TELEGRAM_CHAT_ID=${STOCK_TELEGRAM_CHAT_ID}
      - REGISTRATION_TELEGRAM_BOT_TOKEN=${REGISTRATION_TELEGRAM_BOT_TOKEN}
      - REGISTRATION_TELEGRAM_CHAT_ID=${REGISTRATION_TELEGRAM_CHAT_ID}
      - FILE_IMPORT_PREFETCH_COUNT=${FILE_IMPORT_PREFETCH_COUNT}
      - FILE_IMPORT_RETRY_DELAY=${FILE_IMPORT_RETRY_DELAY}
      - FILE_IMPORT_MAX_RETRIES=${FILE_IMPORT_MAX_RETRIES}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_PATH=${UPLOAD_PATH}
      - PROCESSED_PATH=${PROCESSED_PATH}
      - FAILED_PATH=${FAILED_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - rabbitmq-dev
      - mongodb-dev
      - redis-dev
    volumes:
      - ./server/uploads:/app/uploads
      - ./file-processing/processed:/app/processed
      - ./file-processing/failed:/app/failed
    networks:
      - lgdx-dev-network

  # Market Price Calculator Service (Development)
  market-price-calculator-dev:
    build: 
      context: ./market-price-calculator-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb-dev:27017/lgdx_dev?authSource=admin
      - OIL_PRICE_API=${OIL_PRICE_API}
      - COEFF_INR=0.1
      - COEFF_GOLD=0.1
      - COEFF_OIL=0.1
      - LOG_LEVEL=${LOG_LEVEL}
      - CALCULATION_INTERVAL=0 * * * *
    depends_on:
      - mongodb-dev
    volumes:
      - ./market-price-calculator-service/logs:/app/logs
    networks:
      - lgdx-dev-network

  # Analytics Service (Development)
  analytics-service-dev:
    build: 
      context: ./analytics-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9201:9200"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb-dev:27017/lgdx_dev?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-dev:6379
      - SERVICE_COORDINATOR_ENABLED=true
      - BACKEND_HOST=lgdx-server-dev
      - BACKEND_PORT=5000
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - mongodb-dev
      - lgdx-server-dev
    volumes:
      - ./analytics-service/logs:/app/logs
    networks:
      - lgdx-dev-network

  # Dev seed: тестовые пользователи + сток продуктов (идемпотентно, после старта сервера)
  dev-seed:
    build:
      context: ./scripts/dev-seed
      dockerfile: Dockerfile
    restart: "no"
    environment:
      - SEED_API_URL=http://lgdx-server-dev:5000
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
    depends_on:
      lgdx-server-dev:
        condition: service_healthy
    networks:
      - lgdx-dev-network

  # LGDX Client (Development)
  # Ports 3001–3010 often reserved by Windows/Hyper-V; use CLIENT_PORT in .env (default 3080)
  lgdx-client-dev:
    build: 
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3080}:3000"
    environment:
      # Use CRA proxy (/api) to avoid CORS in dev
      - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
      - NODE_ENV=${NODE_ENV:-development}
      # Periodic polling (ms). 5000 = every 5s; for instant refresh run: docker exec <client-container> touch /app/src/App.tsx
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=${DEV_POLLING_INTERVAL:-5000}
      - FAST_REFRESH=true
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=${CLIENT_PORT:-3080}
    volumes:
      - ./client:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - lgdx-server-dev
    networks:
      - lgdx-dev-network

volumes:
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  rabbitmq_dev_data:
    driver: local

networks:
  lgdx-dev-network:
    driver: bridge 