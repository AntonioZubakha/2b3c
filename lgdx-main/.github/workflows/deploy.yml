name: LGDX Microservices CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: lgdx
          RABBITMQ_DEFAULT_PASS: lgdx2024
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing server dependencies..."
          cd server && npm ci
          echo "Installing client dependencies..."
          cd ../client && npm ci
          echo "Installing API sync service dependencies..."
          cd ../api-product-sync-service && npm ci
          echo "Installing file import service dependencies..."
          cd ../file-product-import-service && npm ci
          echo "Installing market price calculator dependencies..."
          cd ../market-price-calculator-service && npm ci
          echo "Installing backup service dependencies..."
          cd ../backup-service && npm ci

      - name: Run linting
        run: |
          echo "Linting server..."
          cd server && npm run lint || echo "No lint script found"
          echo "Linting client..."
          cd ../client && npm run lint || echo "No lint script found"
          echo "Linting API sync service..."
          cd ../api-product-sync-service && npm run lint || echo "No lint script found"
          echo "Linting file import service..."
          cd ../file-product-import-service && npm run lint || echo "No lint script found"
          echo "Linting market price calculator..."
          cd ../market-price-calculator-service && npm run lint || echo "No lint script found"
          echo "Linting backup service..."
          cd ../backup-service && npm run lint || echo "No lint script found"

      - name: Run tests
        run: |
          echo "Testing server..."
          cd server && npm test || echo "No test script found"
          echo "Testing client..."
          cd ../client && npm test || echo "No test script found"
          echo "Testing API sync service..."
          cd ../api-product-sync-service && npm test || echo "No test script found"
          echo "Testing file import service..."
          cd ../file-product-import-service && npm test || echo "No test script found"
          echo "Testing market price calculator..."
          cd ../market-price-calculator-service && npm test || echo "No test script found"
          echo "Testing backup service..."
          cd ../backup-service && npm test || echo "No test script found"

      - name: Build TypeScript
        run: |
          echo "Building server..."
          cd server && npm run build || echo "No build script found"
          echo "Building client..."
          cd ../client && npm run build || echo "No build script found"
          echo "Building API sync service..."
          cd ../api-product-sync-service && npm run build || echo "No build script found"
          echo "Building file import service..."
          cd ../file-product-import-service && npm run build || echo "No build script found"
          echo "Building market price calculator..."
          cd ../market-price-calculator-service && npm run build || echo "No build script found"
          echo "Building backup service..."
          cd ../backup-service && npm run build || echo "No build script found"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit (main branch, fail on high)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Auditing server dependencies (fail on high)..."
          cd server && npm audit --audit-level high
          echo "Auditing client dependencies (fail on high)..."
          cd ../client && npm audit --audit-level high
          echo "Auditing API sync service dependencies (fail on high)..."
          cd ../api-product-sync-service && npm audit --audit-level high
          echo "Auditing file import service dependencies (fail on high)..."
          cd ../file-product-import-service && npm audit --audit-level high
          echo "Auditing market price calculator dependencies (fail on high)..."
          cd ../market-price-calculator-service && npm audit --audit-level high
          echo "Auditing backup service dependencies (fail on high)..."
          cd ../backup-service && npm audit --audit-level high

      - name: Run security audit (non-main, informational)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Auditing server dependencies (informational)..."
          cd server && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"
          echo "Auditing client dependencies (informational)..."
          cd ../client && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"
          echo "Auditing API sync service dependencies (informational)..."
          cd ../api-product-sync-service && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"
          echo "Auditing file import service dependencies (informational)..."
          cd ../file-product-import-service && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"
          echo "Auditing market price calculator dependencies (informational)..."
          cd ../market-price-calculator-service && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"
          echo "Auditing backup service dependencies (informational)..."
          cd ../backup-service && npm audit --audit-level moderate || echo "Vulnerabilities found but continuing"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-server:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-client:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API sync service image
        uses: docker/build-push-action@v5
        with:
          context: ./api-product-sync-service
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-api-sync-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-api-sync-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push file import service image
        uses: docker/build-push-action@v5
        with:
          context: ./file-product-import-service
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-file-import-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-file-import-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push market price calculator image
        uses: docker/build-push-action@v5
        with:
          context: ./market-price-calculator-service
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-market-price-calculator:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-market-price-calculator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backup service image
        uses: docker/build-push-action@v5
        with:
          context: ./backup-service
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/lgdx-backup-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_REGISTRY }}/lgdx-backup-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment logic here
          echo "Staging deployment completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}

      - name: Deploy to production server
        run: |
          echo "🚀 Starting production deployment to ${{ env.SERVER_HOST }}..."
          
          # Pull latest images and update all services
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            echo "📁 Changing to LGDX directory..."
            cd /opt/lgdx
            
            echo "🐳 Pulling latest Docker images..."
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-server:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-client:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-api-sync-service:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-file-import-service:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-market-price-calculator:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lgdx-backup-service:latest
            
            echo "🏷️ Tagging images for local use..."
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-server:latest lgdx-lgdx-server:latest
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-client:latest lgdx-lgdx-client:latest
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-api-sync-service:latest lgdx-api-sync-service:latest
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-file-import-service:latest lgdx-file-import-service:latest
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-market-price-calculator:latest lgdx-market-price-calculator:latest
            docker tag ${{ env.DOCKER_REGISTRY }}/lgdx-backup-service:latest lgdx-backup-service:latest
            
            echo "🔄 Updating Docker Swarm services..."
            docker service update --force lgdx_lgdx-server
            docker service update --force lgdx_lgdx-client
            docker service update --force lgdx_api-sync-service
            docker service update --force lgdx_file-import-service
            docker service update --force lgdx_market-price-calculator
            docker service update --force lgdx_backup-service
            
            echo "🌐 Updating nginx service..."
            docker service update --force lgdx_nginx
            
            echo "⏳ Waiting for services to stabilize..."
            sleep 30
            
            echo "📊 Checking service status..."
            docker service ls
            
            echo "✅ Production deployment completed successfully!"
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            echo "Checking service health..."
            docker service ls --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}\t{{.Ports}}"
            
            echo "Checking service logs for errors..."
            docker service logs lgdx_lgdx-server --tail 10
            docker service logs lgdx_lgdx-client --tail 5
          EOF

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 LGDX services have been updated and deployed to production!"
          echo "📊 Check service status: ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} 'cd /opt/lgdx && docker service ls'"
          # Add notification logic (Slack, Telegram, etc.)
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "🔍 Check GitHub Actions logs for details"
          echo "🛠️ Manual intervention may be required"
          # Add failure notification logic 