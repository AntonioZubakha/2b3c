# =============================
# LGDX Production (Local) Compose
# =============================
# Этот файл предназначен для локального production окружения (не для боевого сервера)
# Использует локальные Docker secrets и volume'ы
#
# Для боевого сервера используйте docker-compose.prod.secure.final.yml
# =============================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # MongoDB Production
  mongodb:
    image: mongo:6.0
    logging: *default-logging
    # Keep published port for local testing of the DB
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_password
      MONGO_INITDB_DATABASE: lgdx
    # WiredTiger cache фиксируем на 2GB (≈50% от лимита 4G).
    # По умолчанию Mongo берёт 50% хост-RAM, что в Swarm с лимитом контейнера
    # приводит к OOM. Привязываем cache к реально доступной памяти контейнера.
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "2"
      - --bind_ip_all
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lgdx-network
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'mongosh --username admin --password $$(cat /run/secrets/mongodb_password) --authenticationDatabase admin --eval "db.adminCommand(''ping'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 4G # УВЕЛИЧЕНО (было 2G) - устраняет startup warning о памяти и снимает риск OOM.
          cpus: "1.5"
        reservations:
          memory: 2G # УВЕЛИЧЕНО (было 1G) - гарантированное место под WiredTiger cache (2G).
          cpus: "0.8"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s
    secrets:
      - mongodb_password

  # Redis Production
  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Keep published port for local testing of Redis
    ports:
      - "6379:6379"
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - redis_data:/data
    networks:
      - lgdx-network
    secrets:
      - redis_password
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "redis-cli -a $$(cat /run/secrets/redis_password) ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # RabbitMQ Production
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    logging: *default-logging
    hostname: rabbitmq
    # Keep published ports for local testing of AMQP and management UI
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lgdx
    command: sh -c 'export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbitmq_password); rabbitmq-server'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    # Swarm DNS is stack-scoped (lgdx_rabbitmq); secrets often use host "rabbitmq"
    networks:
      lgdx-network:
        aliases:
          - rabbitmq
    secrets:
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "sh", "-c", "rabbitmq-diagnostics ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Main Server Production
  lgdx-server:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    ports:
      - "5000:5000"
    # No user: — start as root so entrypoint can chown bind-mounted ./server/uploads → 1001:1001, then su-exec to app user
    environment:
      NODE_ENV: production
      ARE_MICROSERVICES_LIVE: "true"
      COOKIE_SECURE: "false"
      CSP_ENFORCE: "true"
      PUBLIC_UPLOADS_ENABLED: "false"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_SECRET_KEY_FILE: /run/secrets/admin_secret_key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      # Chat IDs from secrets
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # System Monitoring Bot
      SYSTEM_MONITORING_BOT_TOKEN_FILE: /run/secrets/system_monitoring_bot_token
      SYSTEM_MONITORING_CHAT_ID_FILE: /run/secrets/system_monitoring_chat_id
      CHAT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/chat_telegram_bot_token
      CHAT_TELEGRAM_CHAT_ID_FILE: /run/secrets/chat_telegram_chat_id
      # Registration Telegram Bot (username = bot @username without @, for "Link Telegram" link)
      REGISTRATION_TELEGRAM_BOT_USERNAME_FILE: /run/secrets/registration_telegram_bot_username
      REGISTRATION_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/registration_telegram_bot_token
      REGISTRATION_TELEGRAM_CHAT_ID_FILE: /run/secrets/registration_telegram_chat_id
      # Logist Telegram (notifications: ready for shipment, delivery confirmed)
      LOGIST_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/logist_telegram_bot_token
      LOGIST_TELEGRAM_CHAT_ID_FILE: /run/secrets/logist_telegram_chat_id
      # Twilio SMS Configuration
      TWILIO_ACCOUNT_SID_FILE: /run/secrets/twilio_account_sid
      TWILIO_AUTH_TOKEN_FILE: /run/secrets/twilio_auth_token
      TWILIO_VERIFY_SERVICE_SID_FILE: /run/secrets/twilio_verify_service_sid
      FRONTEND_BASE_URL: "http://localhost"
      FTP_DATA_PATH: "/app/ftp-data"
      OIL_PRICE_API_FILE: /run/secrets/oil_price_api
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # Support chat: только OpenRouter (без вызова Gemini — иначе при 429 Gemini ответ не доходит до OR)
      SUPPORT_AI_PRIMARY: "openrouter"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      MAX_FILE_SIZE: "50MB"
      UPLOAD_PATH: "./uploads"
      LOG_LEVEL: "info"
      INVITE_DENY_DOMAINS: "mailinator.com,tempmail.com"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "info@lgdeal.com"
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      SMTP_FROM: "info@lgdeal.com"
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_PUBLISHABLE_KEY_FILE: /run/secrets/stripe_publishable_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      # Performance optimizations
      NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
      UV_THREADPOOL_SIZE: "16"
      MONGODB_POOL_SIZE: "20"
      MONGODB_SOCKET_TIMEOUT: "30000"
      MONGODB_CONNECT_TIMEOUT: "10000"
      REDIS_CONNECTION_POOL_SIZE: "20"
      REDIS_COMMAND_TIMEOUT: "5000"
      RABBITMQ_CONNECTION_POOL_SIZE: "10"
      # Market price calculator (admin trigger "Run Market Calculation")
      MARKET_PRICE_CALCULATOR_URL: "http://market-price-calculator:9100"
      # Admin panel → resource usage (cAdvisor via Prometheus; same overlay as prometheus service)
      PROMETHEUS_URL: "http://prometheus:9090"
      # Legacy FTP encryption key (shared with legacy-ftp-poller-service)
      LEGACY_FTP_CRYPTO_KEY_FILE: /run/secrets/legacy_ftp_crypto_key
      LEGACY_POLLER_URL: "http://legacy-ftp-poller:3001"
      FTP_SERVICE_URL: "http://ftp-service:3000"
      # WhatsApp Cloud API (webhook verify + optional signature check on POST)
      WHATSAPP_ENABLED: "true"
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_BAILEYS_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp
    # Entrypoint runs as root briefly to chown bind-mounted uploads, then su-exec → UID 1001.
    # cap_drop: ALL + no-new-privileges breaks su-exec/chown; keep hardening on other services.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lgdx-network
    secrets:
      - jwt_secret
      - admin_secret_key
      - telegram_bot_token
      - stock_telegram_bot_token
      - telegram_chat_id
      - stock_telegram_chat_id
      - registration_telegram_bot_username
      - registration_telegram_bot_token
      - registration_telegram_chat_id
      - logist_telegram_bot_token
      - logist_telegram_chat_id
      - twilio_account_sid
      - twilio_auth_token
      - twilio_verify_service_sid
      - system_monitoring_bot_token
      - system_monitoring_chat_id
      - chat_telegram_bot_token
      - chat_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - oil_price_api
      - gemini_api_key
      - openrouter_api_key
      - smtp_pass
      - stripe_secret_key
      - stripe_publishable_key
      - stripe_webhook_secret
      - legacy_ftp_crypto_key
      - openai_api_key
      - whatsapp_verify_token
      - whatsapp_app_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G # УВЕЛИЧЕНО (было 2G) - больше памяти для кэширования
          cpus: "3.0" # УВЕЛИЧЕНО (было 2.0) - больше CPU для обработки
        reservations:
          memory: 2.5G # УВЕЛИЧЕНО (было 1.5G) - больше гарантированной памяти
          cpus: "2.0" # УВЕЛИЧЕНО (было 1.2) - больше гарантированного CPU
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # WhatsApp marketing LLM worker (same image as API, separate CMD). Set deploy.replicas to 1 when Meta + env are ready.
  whatsapp-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    user: "1001:1001"
    command: ["node", "dist/whatsapp/whatsappWorker.js"]
    depends_on:
      - rabbitmq
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      WHATSAPP_ENABLED: "true"
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      WHATSAPP_ACCESS_TOKEN_FILE: /run/secrets/whatsapp_access_token
      WHATSAPP_PHONE_NUMBER_ID_FILE: /run/secrets/whatsapp_phone_number_id
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_GRAPH_API_VERSION: "${WHATSAPP_GRAPH_API_VERSION:-v21.0}"
      OPENROUTER_MODEL_WHATSAPP: "${OPENROUTER_MODEL_WHATSAPP:-google/gemini-2.0-flash-001}"
      NODE_OPTIONS: "--max-old-space-size=768"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - rabbitmq_url
      - redis_url
      - mongodb_uri
      - openrouter_api_key
      - whatsapp_verify_token
      - whatsapp_access_token
      - whatsapp_phone_number_id
      - whatsapp_app_secret
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.15"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  whatsapp-baileys-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    # Named volume is root-owned; entrypoint chowns WHATSAPP_BAILEYS_AUTH_DIR then su-exec → appuser
    # Use /bin/sh explicitly so CRLF in repo on Windows cannot break shebang inside the script
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint-baileys.sh"]
    command: ["node", "dist/whatsapp/whatsappBaileysWorker.js"]
    depends_on:
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      WHATSAPP_BAILEYS_ENABLED: "true"
      REDIS_URL_FILE: /run/secrets/redis_url
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts
      # crash the inbound pipeline and admin loses visibility into customer messages)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_MODEL_WHATSAPP_BAILEYS: "${OPENROUTER_MODEL_WHATSAPP_BAILEYS:-google/gemini-2.0-flash-001}"
      WHATSAPP_BAILEYS_AUTH_DIR: /data/auth_baileys
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - whatsapp_baileys_data:/data/auth_baileys:rw
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    # Do not use cap_drop: ALL here: Docker Swarm/Desktop often still fails su-exec setgroups()
    # even with cap_add CHOWN/SETUID/SETGID. Node runs as appuser after entrypoint.
    networks:
      - lgdx-network
    secrets:
      - redis_url
      - mongodb_uri
      - openrouter_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.15"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Telegram user (GramJS / MTProto) — one replica. API id/hash: config/stack-local-secrets/* (see README there).
  # stack deploy does not load .env — TELEGRAM_USER_CLIENT_ENABLED is enabled here for local stack.
  telegram-user-worker:
    image: lgdx-lgdx-server:latest
    logging: *default-logging
    user: "1001:1001"
    command: ["node", "dist/telegramUser/telegramUserWorker.js"]
    depends_on:
      - redis
      - mongodb
    environment:
      NODE_ENV: production
      TELEGRAM_USER_CLIENT_ENABLED: "true"
      TELEGRAM_API_ID_FILE: /run/secrets/telegram_user_api_id
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram_user_api_hash
      TELEGRAM_USER_AUTH_DIR: /data/telegram_user
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      # DB-backed admin prompt + user/role lookups (else 10s Mongoose buffer timeouts)
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_MODEL_TELEGRAM_USER: "${OPENROUTER_MODEL_TELEGRAM_USER:-google/gemini-2.0-flash-001}"
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - telegram_user_data:/data/telegram_user:rw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    networks:
      - lgdx-network
    secrets:
      - redis_url
      - mongodb_uri
      - openrouter_api_key
      - telegram_user_api_id
      - telegram_user_api_hash
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.15"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # API Sync Service Production
  api-sync-service:
    image: lgdx-api-sync-service:latest
    logging: *default-logging
    user: "1001:1001"
    stop_grace_period: 2500s
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      RABBITMQ_HOST_OVERRIDE: "lgdx_rabbitmq"
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      SERVICE_COORDINATOR_ENABLED: "true"
      NODE_OPTIONS: "--max-old-space-size=2048"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      API_SYNC_PREFETCH_COUNT: "2"
      API_SYNC_RETRY_DELAY: "10000"
      API_SYNC_MAX_RETRIES: "3"
      API_MAX_CONCURRENCY: "5"
      API_CB_FAILURES: "5"
      API_CB_COOLDOWN_MS: "60000"
      # Расписание синхронизации в часы минимальной нагрузки
      SYNC_SCHEDULE: "0 2 * * *"
    volumes:
      - ./file-processing/reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
    # Liveness on metrics port: /health is always 200. Port 8080 is readiness (503 until Rabbit consumer ready).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 3G # Замеры пика ~1.5 GiB; запас под пики/GC
          cpus: "2.0" # Пик ~1.5 vCPU
        reservations:
          memory: 1G
          cpus: "0.5" # Ожидание между sync; пик получает до лимита
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # File Import Service Production
  file-import-service:
    image: lgdx-file-import-service:latest
    logging: *default-logging
    user: "1001:1001"
    stop_grace_period: 2500s
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    environment:
      NODE_ENV: production
      # Softer startup and lower steady-state heap pressure
      NODE_OPTIONS: "--max-old-space-size=4096"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # Secret may contain host that differs from Swarm service; override to actual service name
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      FILE_IMPORT_PREFETCH_COUNT: "1"
      FILE_IMPORT_RETRY_DELAY: "15000"
      FILE_IMPORT_MAX_RETRIES: "3"
      MAX_FILE_SIZE: "150MB"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      UPLOAD_PATH: "./uploads"
      PROCESSED_PATH: "./processed"
      FAILED_PATH: "./failed"
      MAX_IMPORT_ROWS: "500000"
      MAX_IMPORT_BYTES: "125829120" # 120 MiB, как в prod.secure.final.yml (после optional supplier CSV preclean)
      FILE_IMPORT_SUPPLIER_CSV_PRECLEAN_COMPANY_IDS: "697d071957479e81df415385"
      # XLSX >= этого размера (в МБ) идут через стриминговый парсер
      XLSX_STREAM_THRESHOLD_MB: "30"
      # Redis lock and RabbitMQ consumer timeout 40 min for large imports (e.g. ~450k rows)
      FILE_IMPORT_LOCK_TTL_SECONDS: "2400"
      FILE_IMPORT_CONSUMER_TIMEOUT_MS: "2400000"
      FILE_IMPORT_CHUNK_ROW_THRESHOLD: "100000"
      FILE_IMPORT_CHUNK_SIZE: "50000"
      FILE_IMPORT_PREWARM_CACHE: "false"
      FILE_IMPORT_REPORT_DETAIL_LIMIT: "10000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./file-processing/processed:/app/processed
      - ./file-processing/failed:/app/failed
      - ./file-processing/reports:/app/reports
      - ftp_data:/app/ftp-data
      - file_import_tmp:/tmp # writable /tmp для ExcelJS streaming и временных CSV чанков
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
      - mongodb_uri
      - rabbitmq_url
      - redis_url
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 7G # ВЫРОВНЕНО с api-product-sync-service для production режима
          cpus: "2.0"
        reservations:
          memory: 1G # Совпадает с api-product-sync-service
          cpus: "0.3"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Market Price Calculator Service Production
  market-price-calculator:
    image: lgdx-market-price-calculator:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      OIL_PRICE_API_FILE: /run/secrets/oil_price_api
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # Economic coefficients optimized for Lab-Grown Diamonds (Phase 1)
      # See: info/27_Economic_Coefficients_Analysis.md
      COEFF_INR: "0.40" # ↑ was 0.1 - Primary driver (80% costs in INR)
      COEFF_GOLD: "0.06" # ↓ was 0.1 - Weak correlation
      COEFF_OIL: "0.07" # ↓ was 0.1 - Logistics only
      LOG_LEVEL: "info"
      CALCULATION_INTERVAL: "0 */3 * * *" # Каждые 3 часа в :00 UTC
      MAX_PROCESSING_TIME: "1800000"
      DB_CONNECTION_TIMEOUT: "60000"
      DB_SOCKET_TIMEOUT: "90000"
      MARKET_PRICE_CACHE_REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      MARKET_PRICE_CACHE_TTL_SECONDS: "86400"
      MARKET_PRICE_CACHE_ENDPOINT: "http://market-price-calculator:9100/market-price-cache"
      # Service Coordinator - координация с Analytics Service
      SERVICE_COORDINATOR_ENABLED: "true"
    volumes:
      - ./market-price-calculator-service/logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - oil_price_api
      - redis_url
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1.2G # УВЕЛИЧЕНО (было 1G) - больше гарантированной памяти
          cpus: "0.6" # УВЕЛИЧЕНО (было 0.5) - больше гарантированного CPU
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Analytics Service Production (OPTIMIZED)
  analytics-service:
    image: lgdx-analytics-service:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      # Allow long analytics aggregations (3 minutes socket timeout)
      MONGODB_SOCKET_TIMEOUT_MS: "180000"
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_HOST_OVERRIDE: "lgdx_redis"
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      BACKEND_HOST: lgdx-server
      BACKEND_PORT: "5000"
      LOG_LEVEL: "info"
      ANALYTICS_SCHEDULE: "45 3 * * *" # Каждый день в 3:45 UTC (избегаем конфликта с другими сервисами)
      NODE_OPTIONS: "--max-old-space-size=1536" # Согласовано с лимитом контейнера 2G
      # Service Coordinator - ждет завершения Market Price Calculator перед запуском
      SERVICE_COORDINATOR_ENABLED: "true"
    volumes:
      - ./analytics-service/logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - redis_url
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    depends_on:
      - mongodb
      - redis
      - lgdx-server
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9200/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G # Замеры пика ~1.07 GiB; запас под агрегации
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  # Backup Service Production
  backup-service:
    image: lgdx-backup-service:latest
    logging: *default-logging
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      REDIS_URL_FILE: /run/secrets/redis_url
      SERVICE_COORDINATOR_ENABLED: "true"
      BACKUP_SCHEDULE: "0 3 * * *"
      RETENTION_COUNT: "7"
      BACKUP_PATH: "/app/backups"
      REPORTS_PATH: "/app/reports"
      REPORTS_RETENTION_HOURS: "24"
      REPORTS_CLEANUP_SCHEDULE: "0 */6 * * *"
      LOG_LEVEL: "info"
    volumes:
      - backup_data:/app/backups
      - ./file-processing/reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - redis_url
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
          cpus: "0.8" # УМЕНЬШЕНО (было 1.0) - освобождаем CPU
        reservations:
          memory: 600M # УВЕЛИЧЕНО (было 512M) - больше гарантированной памяти
          cpus: "0.4" # УМЕНЬШЕНО (было 0.5) - но достаточно для backup раз в день
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # FTP Product Sync Service Production (Secure Final)
  ftp-service:
    image: lgdx-ftp-sync-service:latest
    logging: *default-logging
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "21:21" # FTP control port
      - "10000-10100:10000-10100" # FTP passive data ports
      - "3002:3000" # Health check port (external access for monitoring)
    user: "1001:1001"
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STOCK_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/stock_telegram_bot_token
      STOCK_TELEGRAM_CHAT_ID_FILE: /run/secrets/stock_telegram_chat_id
      # FTP specific settings (производственные значения)
      FTP_PORT: "21"
      FTP_HOST: "0.0.0.0"
      FTP_PASV_URL: "${FTP_PASV_URL}"
      FTP_PASV_PORT_MIN: "10000"
      FTP_PASV_PORT_MAX: "10100"
      FTP_DATA_PATH: "/app/ftp-data" # ✅ Исправлено: путь должен совпадать с volume mapping
      FTP_MAX_FILE_SIZE_MB: "150"
      FTP_ALLOWED_FILE_TYPES: "xlsx,xls,csv"
      FTP_DEFAULT_QUOTA_MB: "1000"
      FTP_MAX_QUOTA_MB: "5000"
      FTP_MAX_CONNECTIONS: "50"
      FTP_CONNECTION_TIMEOUT: "300000"
      FTP_IDLE_TIMEOUT: "900000"
      FTP_MAX_LOGIN_ATTEMPTS: "3"
      FTP_LOGIN_WINDOW: "900000"
      # Принудительно включаем passive режим
      FTP_PASSIVE_MODE: "true"
      FTP_FORCE_PASSIVE: "true"
      # Безопасность: изоляция пользователей
      FTP_ROOT_ISOLATION: "true"
      FTP_CHROOT_TO_USER_HOME: "true"
      FTP_HIDE_SYSTEM_FILES: "true"
      LOG_LEVEL: "info"
      HEALTH_PORT: "3000"
    volumes:
      - ftp_data:/app/ftp-data # ✅ Изменено: файлы теперь в /app/ftp-data для FileWatcher
      # Убираем системные папки из FTP доступа для безопасности
      # - ./server/uploads:/app/uploads
      # - ./reports:/app/reports
    # FTP сервис не может быть read-only из-за необходимости записи файлов
    # read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - telegram_bot_token
      - stock_telegram_bot_token
      - stock_telegram_chat_id
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 768M # Снижено для локального prod-окружения (Docker Desktop)
          cpus: "1.0"
        reservations:
          memory: 256M # Минимум, чтобы контейнер запустился на ограниченных ресурсах
          cpus: "0.3"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Legacy FTP Poller — polls lgdeal.com FTP for companies not yet on new FTP
  legacy-ftp-poller:
    image: lgdx-legacy-ftp-poller:latest
    logging: *default-logging
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      RABBITMQ_HOST_OVERRIDE: "lgdx_rabbitmq"
      REDIS_URL_FILE: /run/secrets/redis_url
      LEGACY_FTP_CRYPTO_KEY_FILE: /run/secrets/legacy_ftp_crypto_key
      FTP_DATA_PATH: /app/ftp-data
      POLL_CRON_SCHEDULE: "0 */12 * * *"
      POLL_CONCURRENCY: "3"
      MAX_CONSECUTIVE_ERRORS: "5"
    volumes:
      - ftp_data:/app/ftp-data
    networks:
      - lgdx-network
    secrets:
      - mongodb_uri
      - rabbitmq_url
      - redis_url
      - legacy_ftp_crypto_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # React Client Production (Local without Sentry)
  lgdx-client:
    image: lgdx-lgdx-client:latest
    logging: *default-logging
    environment:
      - REACT_APP_API_URL=http://localhost/api
    networks:
      - lgdx-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Nginx Reverse Proxy Production
  nginx:
    image: nginx:1.25-alpine
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    networks:
      - lgdx-network
    depends_on:
      - lgdx-server
      - lgdx-client
      - analytics-service
    command:
      - sh
      - -c
      - |
        for host in lgdx_lgdx-server lgdx_lgdx-client lgdx_analytics-service lgdx_market-price-calculator; do
          clean_host=`printf "%s" "$${host}" | tr -d "\015"`
          until getent hosts "$${clean_host}" >/dev/null 2>&1; do
            echo "waiting for $${clean_host}..."
            sleep 2
          done
        done
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      # Убрали constraint - Alertmanager не критичен для размещения на manager
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.05" # Уменьшено - Alertmanager не требует много CPU
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

  # Monitoring stack
  prometheus:
    image: prom/prometheus:v2.53.1
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - lgdx-network
      - monitoring-network
    depends_on:
      - alertmanager
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
          cpus: "0.4"
        reservations:
          memory: 192M
          cpus: "0.2"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    logging: *default-logging
    configs:
      # Имя источника намеренно версионируется (_v5) — Docker Swarm не умеет
      # менять existing config in-place. При правке monitoring/alertmanager.yml
      # бампать суффикс (_v6, _v7…), иначе alertmanager не подхватит изменения.
      - source: alertmanager_config_v5
        target: /etc/alertmanager/alertmanager.yml
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        CHAT_ID=`cat /run/secrets/system_monitoring_chat_id | tr -d '[:space:]'`
        if [ -z "$${CHAT_ID}" ]; then
          echo "[alertmanager] FATAL: system_monitoring_chat_id is empty" >&2
          exit 1
        fi
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s/CHAT_ID_PLACEHOLDER/$${CHAT_ID}/g" /tmp/alertmanager.yml
        if grep -q CHAT_ID_PLACEHOLDER /tmp/alertmanager.yml; then
          echo "[alertmanager] FATAL: CHAT_ID_PLACEHOLDER still present after sed" >&2
          exit 1
        fi
        echo "[alertmanager] config rendered with chat_id=$${CHAT_ID}"
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    secrets:
      - system_monitoring_bot_token
      - system_monitoring_chat_id
    networks:
      - monitoring-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"

  grafana:
    image: grafana/grafana:11.2.0
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_DATABASE_TYPE=sqlite3
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-network
    secrets:
      - source: grafana_admin_user
        target: grafana_admin_user
        uid: "472"
        gid: "0"
        mode: 0400
      - source: grafana_admin_password
        target: grafana_admin_password
        uid: "472"
        gid: "0"
        mode: 0400
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
          cpus: "0.4"
        reservations:
          memory: 192M
          cpus: "0.2"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    logging: *default-logging
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    networks:
      - monitoring-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    logging: *default-logging
    volumes:
      - /:/rootfs:ro
      # Mount full /var/run so cAdvisor can talk to Docker reliably in Swarm/Desktop
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # Docker Desktop may not have /dev/disk; keep mounts minimal for portability
    command:
      - "--housekeeping_interval=30s"
      # Force docker integration off (avoid layerdb lookups on Desktop's image store).
      - "--docker=unix:///var/run/no-docker.sock"
      # Prefer discovering containers via cgroups + containerd on Desktop/Swarm.
      - "--containerd=/var/run/containerd/containerd.sock"
      # Docker Desktop uses containerd namespace "moby"
      - "--containerd-namespace=moby"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory"
    networks:
      - monitoring-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    pid: host

  loki:
    image: grafana/loki:2.9.3
    logging: *default-logging
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    tmpfs:
      - /tmp
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /loki/rules
        exec /usr/bin/loki -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  promtail:
    image: grafana/promtail:2.9.3
    logging: *default-logging
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-network
    depends_on:
      - loki
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

