# Overlay networks: marked external so they exist *before* services attach. Avoids Swarm races
# ("network lgdx_lgdx-network not found" / stale ID after a partial `stack rm`).
# Prerequisite: `docker swarm init` and:
#   powershell -File scripts/win/ensure-lgdx-local-stack-networks.ps1
networks:
  lgdx-network:
    external: true
    name: lgdx_lgdx-network
  monitoring-network:
    external: true
    name: lgdx_monitoring-network

# =============================================================================
# ОПТИМИЗАЦИЯ РЕСУРСОВ ДЛЯ 8 vCPU / 16 GB RAM (LOCAL PRODUCTION)
# =============================================================================
#
# КОНЦЕПЦИЯ: Аналогичные ресурсы как в prod.secure.final.yml для локального тестирования
#
# МОНИТОРИНГ (ОПТИМИЗИРОВАН):
# ✅ ELK Stack заменён на Loki + Promtail (экономия ~3.5GB памяти)
# ✅ Prometheus: оптимизирован до 384M/0.4 CPU (было 512M/0.5)
# ✅ Grafana: оптимизирован до 384M/0.4 CPU (было 512M/0.5)
# ✅ Loki: 512M/0.5 CPU (вместо Elasticsearch 2GB/1.0 CPU)
# ✅ Promtail: 128M/0.2 CPU (вместо Filebeat+Logstash+Kibana ~2.5GB)
#
# ИЗМЕНЕНИЯ ПРИЛОЖЕНИЙ:
# ✅ MongoDB: 1G→2G памяти, 0.5→0.8 CPU (критично для production нагрузки)
# ✅ lgdx-server: 1G→4G памяти, 0.5→2.5G резервации, 1.0→3.0 CPU
# ✅ api-sync-service: лимиты памяти 7G→3G, heap Node 6G→2G; резервация CPU 0.3→0.5
# ✅ analytics-service: лимиты памяти 6G→2G, heap 4G→1536M; резервации 2G/1 CPU → 1G/0.5 CPU
# ✅ market-price-calculator: увеличены резервации 1G→1.2G памяти, 0.5→0.6 CPU
# ✅ backup-service: оптимизированы лимиты CPU 1.0→0.8, память 512M→600M, CPU 0.5→0.4
# ✅ ftp-service: увеличены ресурсы до уровня production 1G→1.5G памяти, 1.0→1.5 CPU
#
# РАСПИСАНИЕ СЕРВИСОВ (избегание конфликтов):
# - XX:00: мониторинг системы (health checks)
# - XX:15: market-price-calculator (через 15 минут после мониторинга)
# - 02:00: api-sync-service (пик нагрузки)
# - 03:00: backup-service (после api-sync)
#
# ПРЕИМУЩЕСТВА:
# ✅ Аналогичные ресурсы как в production для корректного тестирования
# ✅ Оптимизированные резервации для эффективного использования локальных ресурсов
# ✅ Безопасность: все сервисы имеют гарантированные ресурсы
# ✅ Мониторинг: экономия ~3.5GB памяти при сохранении функциональности
# =============================================================================
